<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="Detalle.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">

</head>
<body>
    <form>
  <h3>Registro de Detalle de Factura</h3>
  <label>ID Detalle:</label><input type="number" name="id_detalle"><br>
  <label>ID Factura:</label><input type="number" name="id_factura"><br>
  <label>ID Producto:</label><input type="number" name="id_producto"><br>
  <label>Cantidad:</label><input type="number" name="cantidad"><br>
  <label>Precio Unitario:</label><input type="number" step="0.01" name="precio_unitario"><br>
  <label>Valor Total:</label><input type="number" step="0.01" name="valor_total"><br>
  <button type="submit">Guardar</button>
</form>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>

</body>
</html>
