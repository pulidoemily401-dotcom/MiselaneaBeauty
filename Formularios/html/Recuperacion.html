<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperación de Cuenta</title>
    <link rel="stylesheet" href="Recuperacion.css">
</head>
<body>
    <div class="form-container">
        <h2>Recuperar Cuenta</h2>
        <form action="#" method="POST">
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" placeholder="Ingresa tu correo" required>

            <label for="telefono">Número de Teléfono (opcional):</label>
            <input type="tel" id="telefono" name="telefono" placeholder="Ingresa tu teléfono">

            <button type="submit">Recuperar</button>
        </form>
        <p><a href="login.html">Volver al inicio de sesión</a></p>
    </div>
</body>
</html>
