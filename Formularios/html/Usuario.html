<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Usuario.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">

</head>
<body>

    <form>
  <h3>Registro de Usuario</h3>
  <label>ID Usuario</label><input type="number" name="id_usuario"><br>
  <label>Nombre</label><input type="text" name="nombre"><br>
  <label>Apellido</label><input type="text" name="apellido"><br>
  <label>Correo electrónico</label><input type="email" name="correo"><br>
  <label>Teléfono</label><input type="text" name="telefono"><br>
  <label>Tipo Documento</label><input type="text" name="tipo_doc"><br>
  <label>Número Documento</label><input type="text" name="num_doc"><br>
  <label>Género</label>
  <select name="genero">
    <option>Femenino</option>
    <option>Masculino</option>
  </select><br>
  <label>Contraseña</label><input type="password" name="contrasena"><br>
  <label>Rol</label>
  <select name="rol">
    <option>Usuario</option>
    <option>Proveedor</option>
    <option>Administrador</option>
  </select><br>
  <button type="submit"> Regístrate </button>
</form>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js" integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V" crossorigin="anonymous"></script>

</body>
</html>
