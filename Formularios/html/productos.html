<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="Productos.css">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">

</head>
<body>
    <form>
  <h3>Registro de Producto</h3>
  <label>ID Producto:</label><input type="number" name="id_producto"><br>
  <label>Nombre:</label><input type="text" name="nombre"><br>
  <label>Descripción:</label><textarea name="descripcion"></textarea><br>
  <label>Marca:</label><input type="text" name="marca"><br>
  <label>Precio Venta:</label><input type="number" step="0.01" name="precio"><br>
  <label>Categoría:</label><input type="number" name="id_categoria"><br>
  <label>Stock:</label><input type="number" name="stock"><br>
  <label>Fecha Ingreso:</label><input type="date" name="fecha_ingreso"><br>
  <button type="submit">Guardar</button>
</form>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js" integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V" crossorigin="anonymous"></script>

</body>
</html>
