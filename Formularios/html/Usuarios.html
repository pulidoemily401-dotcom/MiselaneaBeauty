<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuario Tabla </title>
    <link rel="stylesheet" href="Usuario.css">
</head>
<body>
    <div class="formulario_usuario">
        <h2> Usuarios </h2>
        <form action="#" method="POST">
          <div class="id ">
            <label for="number"> ID Usuario </label>
              <input type="number" name="id" required>

          </div>           
     <div class="nom">
         <label>Nombres :</label>
    <input type="text" name="nombre" required>
     </div>

   <div class="ape"> 
     <label>Apellidos :</label>
    <input type="text" name="apellidos" required>
   </div>
     
    <div class="correo">
<label for="email">Correo Electrónico:</label>
       <input type="email" id="email" name="email" placeholder="Ingresa correo" required>
    </div>
     
  <div> 
<label for="telefono">Número de Teléfono :</label>
            <input type="tel" id="telefono" name="telefono" placeholder="Ingresa teléfono">
  </div>
       
      <div class="tipdoc">
         <label for="opcion"> Tipo de Documento:</label>
         <select id="opcion" name="opcion">
    <option value="TI"> TI </option>
    <option value="CC"> CC </option>
    <option value="RC"> RC </option>
         </select>
      </div>
           
      <div>
        <label for="documento">Número de Documento :</label>
            <input type="doc" id="documento" name="documento" placeholder="Ingresa Documento">
      </div>

      <div>
          <label for="op"> Tipo de Genero :</label>
         <select id="op" name="op">
    <option value="MJ"> Femenino </option>
    <option value="MS"> Masculino </option>
         </select>
      </div>

      <button type="submit"> Enviar </button>

   

          

    </div>
    
</body>
</html>
